  logic_corpus:
    url: "https://github.com/Quadruple-Multilevel-projection-project/WANGA-LAB"
    ref: "main"
    authority: "source_terms_chapters_and_logic_records"

logic_dimensions:
  term_count: 175
  chapter_count: 14
  chapter_term_cells: 2450
  evaluation_directions:
    - "forward"
    - "return"
  directional_evaluations_if_both_directions_run: 4900
  logic_gate_count: 231
  gate_registry_status: "SOURCE_PATH_AND_SCHEMA_PENDING_VERIFICATION"
  excel_workbook_count: 7
